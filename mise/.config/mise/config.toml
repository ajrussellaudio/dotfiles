[tools]

# Runtimes
node = "lts"
python = "latest"
go = "latest"
rust = "latest"

# AWS
aws-cli = "latest"
aws-vault = "latest"
terraform = "latest"
terragrunt = "latest"

# Containers
rancher = "latest"

# Package managers
pnpm = "latest"
uv = "latest"
yarn = "latest"
zig = "latest"
bun = "latest"

# Language servers
"npm:typescript-language-server" = "latest"
# Pinned to 6: typescript-language-server wraps tsserver, which TypeScript 7 no longer ships
"npm:typescript" = "6"

[tools.claude-code]
version = "latest"
minimum_release_age = "0s"

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
